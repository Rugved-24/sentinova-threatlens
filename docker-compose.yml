name: threatlens

x-app-image: &app-image
  image: threatlens-api:local
  build:
    context: .
    dockerfile: Dockerfile

x-app-env: &app-env
  APP_ENV: production
  DEMO_MODE: ${DEMO_MODE:-true}
  SECRET_KEY: ${SECRET_KEY:-local-only-change-this-threatlens-secret-key-32}
  COOKIE_SECURE: "true"
  DATABASE_URL: postgresql://threatlens:${POSTGRES_PASSWORD:-threatlens}@postgres:5432/threatlens
  REDIS_URL: redis://redis:6379/0
  ELASTICSEARCH_URL: http://elasticsearch:9200
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  RUN_SCHEDULER: "false"
  RETENTION_DAYS: ${RETENTION_DAYS:-365}
  NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-90}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:8443,https://127.0.0.1:8443}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
  OTX_API_KEY: ${OTX_API_KEY:-}
  THREATFOX_API_KEY: ${THREATFOX_API_KEY:-}
  GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  OUTBOUND_WEBHOOK_URL: ${OUTBOUND_WEBHOOK_URL:-}
  OUTBOUND_WEBHOOK_SECRET: ${OUTBOUND_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatlens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens -d threatlens"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  api:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - threatlens_data:/app/data
    ports:
      - "8000:8000"

  worker:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_SCHEDULER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - threatlens_data:/app/data
    working_dir: /app/backend
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command: ["celery", "-A", "app.celery_app.celery", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_SCHEDULER: "false"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    working_dir: /app/backend
    healthcheck:
      disable: true
    command: ["celery", "-A", "app.celery_app.celery", "beat", "--loglevel=INFO", "--schedule=/app/data/celerybeat-schedule"]
    volumes:
      - threatlens_data:/app/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-threatlens}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  es_data:
  threatlens_data:
  prometheus_data:
  grafana_data:
