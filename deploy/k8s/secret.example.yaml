apiVersion: v1
kind: Secret
metadata:
  name: threatlens-secrets
  namespace: threatlens
type: Opaque
stringData:
  SECRET_KEY: replace-with-at-least-32-random-characters
  POSTGRES_PASSWORD: replace-with-a-strong-database-password
  DATABASE_URL: postgresql://threatlens:replace-with-a-strong-database-password@postgres:5432/threatlens
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: replace-with-a-strong-admin-password
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  OTX_API_KEY: ""
  THREATFOX_API_KEY: ""
  GREYNOISE_API_KEY: ""
  WEBHOOK_SECRET: replace-with-at-least-32-random-characters
  OUTBOUND_WEBHOOK_URL: ""
  OUTBOUND_WEBHOOK_SECRET: ""
  GRAFANA_PASSWORD: replace-with-a-strong-grafana-password
