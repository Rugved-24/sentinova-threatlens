x-production-env: &production-env
  APP_ENV: production
  DEMO_MODE: "false"
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to at least 32 random characters}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  DATABASE_URL: postgresql://threatlens:${POSTGRES_PASSWORD}@postgres:5432/threatlens
  ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  api:
    environment:
      <<: *production-env
    ports: !reset []

  worker:
    environment:
      <<: *production-env

  beat:
    environment:
      <<: *production-env
